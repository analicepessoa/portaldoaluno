<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Estudante - Informática 5.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #2563eb;
            --success: #16a34a;
            --bg: #f8fafc;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 { margin: 0; font-size: 2.5rem; }

        nav {
            display: flex;
            justify-content: center;
            background: #1e40af;
            padding: 10px 0;
        }

        .nav-btn {
            background: none;
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            margin: 0 10px;
        }

        .nav-btn.active, .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-bottom: 4px solid white;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .view-section { display: none; }
        .view-section.active { display: block; }

        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 2px solid #e2e8f0;
        }

        h2 { font-size: 2rem; color: var(--primary); }
        
        .grid-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .huge-btn {
            background: white;
            border: 3px solid var(--primary);
            color: var(--primary);
            padding: 30px 20px;
            font-size: 1.6rem;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .huge-btn:hover {
            background: var(--primary);
            color: white;
        }

        label { display: block; font-size: 1.3rem; font-weight: bold; margin-top: 15px; }
        input, select, textarea {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            margin-top: 5px;
        }

        .btn-action {
            background-color: var(--success);
            color: white;
            padding: 15px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }

        .progress-container { width: 100%; background-color: #cbd5e1; border-radius: 20px; height: 25px; margin-bottom: 20px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background-color: var(--success); transition: width 0.3s; }
        .step-text { font-size: 2rem; line-height: 1.6; margin: 30px 0; font-weight: 500; }
        .click-target { background-color: #fef08a; padding: 5px 15px; border-radius: 8px; border: 2px dashed #ca8a04; font-weight: bold; }
        .nav-steps { display: flex; gap: 20px; }
        .btn-step { flex: 1; padding: 20px; font-size: 1.5rem; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>Portal Cloud - Informática 5.0</h1>
    </header>

    <nav>
        <button class="nav-btn active" onclick="switchView('estudante')">👨‍🎓 ÁREA DO ESTUDANTE</button>
        <button class="nav-btn" onclick="switchView('professor')">👩‍🏫 ÁREA DO PROFESSOR</button>
    </nav>

    <div class="container">

        <section id="view-estudante" class="view-section active">
            <div id="estudante-modulos">
                <h2>Selecione o seu Módulo:</h2>
                <div class="grid-links" id="lista-modulos-estudante"></div>
            </div>

            <div id="estudante-aulas" style="display:none;">
                <button class="btn-action" style="background:#64748b;" onclick="voltarParaModulos()">< Voltar para Módulos</button>
                <h2 id="titulo-modulo-atual">Aulas Disponíveis:</h2>
                <div class="grid-links" id="lista-aulas-estudante"></div>
            </div>

            <div id="estudante-passos" style="display:none;">
                <button class="btn-action" style="background:#64748b;" onclick="voltarParaAulas()">< Sair da Aula</button>
                <h2 id="titulo-aula-atual">Aula</h2>
                <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
                <div class="card" style="text-align:center;">
                    <div id="conteudo-passo" class="step-text"></div>
                    <div class="nav-steps">
                        <button class="btn-step" style="background:#94a3b8; color:white;" id="btnPrev" onclick="mudarPasso(-1)">◀ VOLTAR</button>
                        <button class="btn-step" style="background:var(--success); color:white;" id="btnNext" onclick="mudarPasso(1)">AVANÇAR ▶</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="view-professor" class="view-section">
            <div class="card">
                <h2>Gerenciador de Roteiros na Nuvem</h2>
                <p>O que você salvar aqui atualizará instantaneamente o computador de todos os alunos.</p>
                <hr style="border:1px solid #e2e8f0; margin:20px 0;">

                <label for="prof-modulo">1. Escolha o Módulo:</label>
                <select id="prof-modulo" onchange="carregarTextoExistente()"></select>

                <label for="prof-aula">2. Escolha a Aula:</label>
                <select id="prof-aula" onchange="carregarTextoExistente()"></select>

                <label for="prof-conteudo">3. Digite as Instruções Passo a Passo (Uma por linha):</label>
                <textarea id="prof-conteudo" rows="10" placeholder="Passo 1: Clique em *Iniciar*&#10;Passo 2: Digite seu nome"></textarea>

                <button class="btn-action" onclick="salvarDadosProfessor()">💾 Salvar na Nuvem (Supabase)</button>
            </div>
        </section>

    </div>

    <script>
        // CONFIGURAÇÃO DO SUPABASE
        const SUPABASE_URL = "https://kokwxawasollyqblcuwz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_vGBe4D10ir5VP9DWQh-89A_iywhmJOH";
        
        // Ajustado o nome da variável de conexão para 'bancoDados' para resolver o travamento
        const bancoDados = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let modSelecionado = '';
        let aulaSelecionada = '';
        let passosAulaAtual = [];
        let passoAtual = 0;

        function switchView(view) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            
            if(window.event && window.event.target && window.event.target.classList) {
                window.event.target.classList.add('active');
            }
            document.getElementById(`view-${view}`).classList.add('active');
        }

        // Inicializar os campos do Professor
        function inicializarPainel() {
            try {
                const selectMod = document.getElementById('prof-modulo');
                selectMod.innerHTML = '';
                for (let m = 1; m <= 10; m++) {
                    let opt = document.createElement('option');
                    opt.value = `modulo_${m}`;
                    opt.innerText = `Módulo ${String(m).padStart(2, '0')}`;
                    selectMod.appendChild(opt);
                }

                const selectAula = document.getElementById('prof-aula');
                selectAula.innerHTML = '';
                for (let a = 1; a <= 4; a++) {
                    let opt = document.createElement('option');
                    opt.value = `aula_${a}`;
                    opt.innerText = `Aula 0${a}`;
                    selectAula.appendChild(opt);
                }
                carregarTextoExistente();
                renderizarModulosEstudante();
            } catch (err) {
                console.error("Erro na inicialização visual:", err.message);
            }
        }

        // Carrega as instruções direto do banco de dados de forma segura
        async function carregarTextoExistente() {
            const m = document.getElementById('prof-modulo').value;
            const a = document.getElementById('prof-aula').value;
            const idUnico = `${m}_${a}`;

            try {
                const { data, error } = await bancoDados
                    .from('roteiros_aulas')
                    .select('passos')
                    .eq('id', idUnico)
                    .maybeSingle();

                if (error) throw error;
                document.getElementById('prof-conteudo').value = (data && data.passos) ? data.passos.join('\n') : '';
            } catch (err) {
                console.error("Erro ao buscar dados pedagógicos:", err.message);
            }
        }

        // Salva ou Atualiza o registro na nuvem
        async function salvarDadosProfessor() {
            const m = document.getElementById('prof-modulo').value;
            const a = document.getElementById('prof-aula').value;
            const idUnico = `${m}_${a}`;
            const texto = document.getElementById('prof-conteudo').value;

            const listaPassos = texto.split('\n').filter(linha => linha.trim() !== '');

            if(listaPassos.length === 0) {
                alert("Roteiro vazio! Digite os passos antes de salvar.");
                return;
            }

            try {
                const { error } = await bancoDados
                    .from('roteiros_aulas')
                    .upsert({ id: idUnico, modulo_id: m, aula_id: a, passos: listaPassos });

                if (error) throw error;
                alert("Roteiro salvo na nuvem com sucesso! 🌐");
            } catch (err) {
                alert("Erro ao salvar no banco: " + err.message);
            }
        }

        // --- ÁREA DO ALUNO ---
        function renderizarModulosEstudante() {
            const container = document.getElementById('lista-modulos-estudante');
            container.innerHTML = '';
            for (let m = 1; m <= 10; m++) {
                let btn = document.createElement('button');
                btn.className = 'huge-btn';
                btn.innerText = `Módulo ${String(m).padStart(2, '0')}`;
                btn.onclick = () => entrarNoModulo(`modulo_${m}`);
                container.appendChild(btn);
            }
        }

        function entrarNoModulo(mId) {
            modSelecionado = mId;
            document.getElementById('estudante-modulos').style.display = 'none';
            document.getElementById('estudante-aulas').style.display = 'block';
            document.getElementById('titulo-modulo-atual').innerText = `Módulo ${mId.split('_')[1]} - Escolha a Aula:`;

            const container = document.getElementById('lista-aulas-estudante');
            container.innerHTML = '';
            
            for (let a = 1; a <= 4; a++) {
                let btn = document.createElement('button');
                btn.className = 'huge-btn';
                btn.style.borderColor = 'var(--success)';
                btn.style.color = 'var(--success)';
                btn.innerText = `Aula 0${a}`;
                btn.onclick = () => buscarAulaNuvem(`aula_${a}`);
                container.appendChild(btn);
            }
        }

        // Puxa em tempo real a aula escolhida do Supabase
        async function buscarAulaNuvem(aId) {
            aulaSelecionada = aId;
            const idUnico = `${modSelecionado}_${aId}`;

            try {
                const { data, error } = await bancoDados
                    .from('roteiros_aulas')
                    .select('passos')
                    .eq('id', idUnico)
                    .maybeSingle();

                if (error) throw error;

                if (data && data.passos && data.passos.length > 0) {
                    passosAulaAtual = data.passos;
                    passoAtual = 0;
                    document.getElementById('estudante-aulas').style.display = 'none';
                    document.getElementById('estudante-passos').style.display = 'block';
                    document.getElementById('titulo-aula-atual').innerText = `Módulo ${modSelecionado.split('_')[1]} / Aula 0${aId.split('_')[1]}`;
                    mostrarPasso();
                } else {
                    alert("Esta aula ainda não possui um roteiro cadastrado pelo professor na nuvem.");
                }
            } catch (err) {
                alert("Erro ao conectar com a nuvem: " + err.message);
            }
        }

        function mostrarPasso() {
            const containerTexto = document.getElementById('conteudo-passo');
            const bar = document.getElementById('progressBar');

            let textoLimpo = passosAulaAtual[passoAtual];
            let textoFormatado = textoLimpo.replace(/\*(.*?)\*/g, '<span class="click-target">$1</span>');
            
            containerTexto.innerHTML = textoFormatado;

            const pct = ((passoAtual + 1) / passosAulaAtual.length) * 100;
            bar.style.width = `${pct}%`;

            document.getElementById('btnPrev').disabled = passoAtual === 0;
            document.getElementById('btnNext').innerText = (passoAtual === passosAulaAtual.length - 1) ? "FINALIZAR AULA 🏁" : "AVANÇAR ▶";
        }

        function mudarPasso(direcao) {
            passoAtual += direcao;
            if (passoAtual >= passosAulaAtual.length) {
                alert("Excelente! Você completou o roteiro desta aula! 🎓");
                voltarParaAulas();
                return;
            }
            mostrarPasso();
        }

        function voltarParaModulos() {
            document.getElementById('estudante-aulas').style.display = 'none';
            document.getElementById('estudante-modulos').style.display = 'block';
        }

        function voltarParaAulas() {
            document.getElementById('estudante-passos').style.display = 'none';
            document.getElementById('estudante-aulas').style.display = 'block';
        }

        window.onload = inicializarPainel;
    </script>
</body>
</html>
