<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Portal do Estudante - Informática 5.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>
    <style>
        /* CSS simplificado para evitar erro de carga */
        body { font-family: Arial; background-color: #f1f5f9; padding: 20px; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        .card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .huge-btn { padding: 20px; border: 2px solid #2563eb; background: white; cursor: pointer; width: 100%; margin-bottom: 10px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <nav>
        <button onclick="mudarAba('estudante')">ÁREA DO ESTUDANTE</button>
        <button onclick="mudarAba('professor')">ÁREA DO PROFESSOR</button>
    </nav>

    <div id="view-estudante" class="view-section active">
        <div id="estudante-cursos">
            <button class="huge-btn" onclick="solicitarSenhaCurso('informatica', 'Informática 5.0')">💻 Informática 5.0</button>
            <button class="huge-btn" onclick="solicitarSenhaCurso('senior', 'Curso Sênior')">👵 Curso Sênior</button>
        </div>
        <div id="estudante-senha-tela" style="display:none;">
            <input type="password" id="input-senha-aluno" placeholder="Senha">
            <button onclick="validarSenhaAcesso()">ENTRAR</button>
        </div>
        <div id="estudante-modulos" style="display:none;"></div>
        <div id="estudante-aulas" style="display:none;"></div>
        <div id="estudante-passos" style="display:none;"></div>
    </div>

    <section id="view-professor" class="view-section">
        <div class="card">
            <h2>Configurações</h2>
            <select id="prof-curso"><option value="informatica">Informática</option><option value="senior">Sênior</option></select>
            <select id="prof-modulo"></select>
            <select id="prof-aula"></select>
            <input type="text" id="prof-nome-modulo" placeholder="Nome Módulo">
            <input type="text" id="prof-nome-aula" placeholder="Nome Aula">
            <input type="text" id="prof-senha-modulo-especifica" placeholder="Senha deste Módulo">
            <button onclick="salvadDadosNovoFormato()">💾 SALVAR TUDO</button>
        </div>
    </section>

    <script>
        const SUPABASE_URL = "https://kokwxawasollyqblcuwz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_vGBe4D10ir5VP9DWQh-89A_iywhmJOH";
        const bancoDados = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function salvDadosNovoFormato() {
            const c = document.getElementById('prof-curso').value;
            const m = document.getElementById('prof-modulo').value;
            const a = document.getElementById('prof-aula').value;
            const senha = document.getElementById('prof-senha-modulo-especifica').value;
            
            // O segredo aqui é salvar TUDO como uma string na coluna 'nome_aula'
            // Formato: NomeDaAula ||| Senha
            const nAula = document.getElementById('prof-nome-aula').value.trim() + " ||| " + senha;

            try {
                const { error } = await bancoDados.from('roteiros_aulas').upsert({ 
                    id: `${c}_${m}_${a}`,
                    nome_modulo: document.getElementById('prof-nome-modulo').value,
                    nome_aula: nAula,
                    passos: ["salvo"]
                });
                if(error) throw error;
                alert("Salvo com sucesso!");
            } catch(e) { alert("Erro ao salvar: " + e.message); }
        }

        function mudarAba(aba) {
            document.querySelectorAll('.view-section').forEach(s => s.style.display = 'none');
            document.getElementById('view-' + aba).style.display = 'block';
        }
    </script>
</body>
</html>
