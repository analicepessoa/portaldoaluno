<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Estudante - Informática 5.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>
    <style>
        /* Estilos mantidos para garantir o funcionamento do design */
        :root { --primary: #2563eb; --primary-dark: #1e40af; --success: #16a34a; --bg: #f1f5f9; --text: #1e293b; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; }
        header { background-color: var(--primary); color: white; padding: 25px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .container { max-width: 1100px; margin: 30px auto; padding: 20px; }
        .view-section { display: none; } .view-section.active { display: block; }
        .card { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 25px; border: 2px solid #e2e8f0; }
        .huge-btn { background: white; border: 3px solid #cbd5e1; color: #334155; padding: 25px 20px; border-radius: 24px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 12px; min-height: 160px; }
        .step-image { width: 90%; max-width: 950px; max-height: 550px; object-fit: contain; border-radius: 20px; border: 3px solid white; margin-bottom: 20px; }
        .inline-gif { display: inline-block; max-height: 150px; margin: 10px; }
        .btn-action { background-color: var(--success); color: white; padding: 14px 30px; border: none; border-radius: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <header><h1>Portal de Aprendizado - Informática 5.0</h1></header>
    <div class="container">
        <section id="view-professor" class="view-section active">
            <div class="card">
                <h2>Gerenciador de Aulas</h2>
                <select id="prof-curso"></select>
                <input type="text" id="prof-nome-modulo" placeholder="Nome do Módulo">
                <input type="text" id="prof-nome-aula" placeholder="Nome da Aula">
                <input type="text" id="prof-senha-modulo-especifica" placeholder="Senha deste Módulo">
                
                <button class="btn-action" onclick="salvarTudoCorretamente()">💾 SALVAR ROTEIRO E SENHA</button>
            </div>
            <div id="editor-passos-container"></div>
        </section>
    </div>

    <script>
        const SUPABASE_URL = "https://kokwxawasollyqblcuwz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_vGBe4D10ir5VP9DWQh-89A_iywhmJOH";
        const bancoDados = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function salvarTudoCorretamente() {
            const c = document.getElementById('prof-curso').value;
            const m = document.getElementById('prof-modulo').value;
            const a = document.getElementById('prof-aula').value;
            const senha = document.getElementById('prof-senha-modulo-especifica').value.trim();
            const nAula = document.getElementById('prof-nome-aula').value.trim();

            // Salvamos a senha ANEXADA ao nome da aula para garantir que o banco aceite
            const nomeAulaComSenha = senha ? `${nAula} ||| ${senha}` : nAula;

            try {
                await bancoDados.from('roteiros_aulas').upsert({ 
                    id: `${c}_${m}_${a}`,
                    nome_modulo: document.getElementById('prof-nome-modulo').value,
                    nome_aula: nomeAulaComSenha,
                    passos: ["salvo"]
                });
                alert("Senha e Roteiro gravados com sucesso!");
            } catch(e) { alert("Erro ao salvar: " + e.message); }
        }
    </script>
</body>
</html>
