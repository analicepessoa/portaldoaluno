<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Estudante - Informática 5.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.js"></script>
    <style>
        :root { --primary: #2563eb; --primary-dark: #1e40af; --success: #16a34a; --bg: #f1f5f9; --text: #1e293b; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; }
        header { background-color: var(--primary); color: white; padding: 25px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .container { max-width: 1100px; margin: 30px auto; padding: 20px; }
        .view-section { display: none; } .view-section.active { display: block; }
        .card { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 25px; border: 2px solid #e2e8f0; }
        .huge-btn { background: white; border: 3px solid #cbd5e1; color: #334155; padding: 25px; border-radius: 24px; cursor: pointer; width: 100%; font-size: 1.4rem; font-weight: bold; margin-bottom: 10px; }
        .step-image { width: 90%; max-width: 950px; border-radius: 20px; border: 3px solid white; margin-bottom: 20px; }
        .inline-gif { display: inline-block; max-height: 150px; margin: 10px; }
        .btn-action { background-color: var(--success); color: white; padding: 14px 30px; border: none; border-radius: 12px; cursor: pointer; }
        .step-editor-item { background: white; padding: 20px; border-radius: 16px; margin-bottom: 15px; border-left: 6px solid var(--primary); border: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <header><h1>Portal de Aprendizado</h1></header>
    <div class="container">
        <section id="view-estudante" class="view-section active">
            <div id="estudante-cursos">
                <h2>Selecione o seu Curso:</h2>
                <button class="huge-btn" onclick="solicitarSenhaCurso('informatica', 'Informática 5.0')">💻 Informática 5.0</button>
                <button class="huge-btn" onclick="solicitarSenhaCurso('senior', 'Curso Sênior')">👵 Curso Sênior</button>
            </div>
            <div id="estudante-modulos" style="display:none;"></div>
            <div id="estudante-senha-tela" style="display:none;">
                <input type="password" id="input-senha-aluno" placeholder="Senha">
                <button onclick="validarSenhaAcesso()">ENTRAR</button>
            </div>
        </section>
        <section id="view-professor" class="view-section">
            <div class="card">
                <h2>Gerenciador</h2>
                <input type="text" id="prof-nome-aula" placeholder="Nome da Aula">
                <input type="text" id="prof-senha-modulo-especifica" placeholder="Senha do Módulo">
                <button class="btn-action" onclick="salvarTudoComSenha()">💾 SALVAR</button>
                <div id="editor-passos-container"></div>
            </div>
        </section>
    </div>
    <script>
        const SUPABASE_URL = "https://kokwxawasollyqblcuwz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_vGBe4D10ir5VP9DWQh-89A_iywhmJOH";
        const bancoDados = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function salvarTudoComSenha() {
            const c = 'informatica'; const m = 'modulo_1'; const a = 'aula_1';
            const senha = document.getElementById('prof-senha-modulo-especifica').value.trim();
            const nAula = document.getElementById('prof-nome-aula').value.trim();
            const nomeComSenha = `${nAula} ||| ${senha}`;
            try {
                await bancoDados.from('roteiros_aulas').upsert({ 
                    id: `${c}_${m}_${a}`, 
                    nome_aula: nomeComSenha, 
                    passos: ["conteudo_salvo"] 
                });
                alert("Salvo com sucesso!");
            } catch(e) { alert("Erro: " + e.message); }
        }
        function mudarAba(aba) {
            document.querySelectorAll('.view-section').forEach(s => s.style.display = 'none');
            document.getElementById('view-' + aba).style.display = 'block';
        }
    </script>
</body>
</html>
